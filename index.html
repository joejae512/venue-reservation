<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>越港生活圈場地預約瀏覽</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: "Microsoft JhengHei", sans-serif; }
    .header-title { background: #1e3a8a; color: white; padding: 20px 0; text-align: center; }
    .calendar-table th { background-color: #3b82f6; color: white; text-align: center; width: 14.28%; }
    .calendar-table td { height: 120px; vertical-align: top; background-color: white; padding: 5px; font-size: 0.85rem; }
    .day-number { font-weight: bold; margin-bottom: 5px; color: #475569; }
    .other-month { background-color: #f1f5f9; color: #cbd5e1; }
    .event-badge { display: block; margin-bottom: 3px; padding: 3px 5px; border-radius: 4px; color: white; cursor: pointer; text-decoration: none; text-overflow: ellipsis; overflow: hidden; whitespace: nowrap; }
    .badge-full { background-color: #ef4444; } /* 全天: 紅色 */
    .badge-morning { background-color: #3b82f6; } /* 上午: 藍色 */
    .badge-afternoon { background-color: #f59e0b; } /* 下午: 橘色 */
    .nav-tabs .nav-link.active { font-weight: bold; border-top: 3px solid #1e3a8a; }
  </style>
</head>
<body>

  <div class="header-title">
    <h2>越港生活圈場地預約瀏覽</h2>
  </div>

  <div class="container my-4">
    <!-- 功能分頁切換 -->
    <ul class="nav nav-tabs mb-3" id="mainTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="calendar-tab" data-bs-toggle="tab" data-bs-target="#calendar-view" type="button">📅 月曆預約狀況</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-view" type="button">⚙️ 管理者專區</button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
      
      <!-- 1. 月曆瀏覽介面 -->
      <div class="tab-pane fade show active" id="calendar-view">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <button class="btn btn-outline-primary" onclick="changeMonth(-1)">❮ 上一個月</button>
          <h4 id="currentMonthStr" class="mb-0 fw-bold"></h4>
          <button class="btn btn-outline-primary" onclick="changeMonth(1)">下一個月 ❯</button>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered calendar-table">
            <thead>
              <tr>
                <th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th>
              </tr>
            </thead>
            <tbody id="calendarBody">
              <!-- 月曆由 JS 動態生成 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 2. 管理者專區 -->
      <div class="tab-pane fade" id="admin-view">
        <!-- 登入卡片 -->
        <div id="adminLoginForm" class="card mx-auto" style="max-width: 400px;">
          <div class="card-body">
            <h5 class="card-title text-center">管理者登入</h5>
            <div class="mb-3">
              <label>帳號</label>
              <input type="text" id="loginUser" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>密碼</label>
              <input type="password" id="loginPwd" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100" onclick="login()">登入</button>
          </div>
        </div>

        <!-- 管理操作面板 (登入後顯示) -->
        <div id="adminPanel" class="d-none">
          <div class="d-flex justify-content-between mb-3">
            <h5>管理者功能</h5>
            <button class="btn btn-sm btn-secondary" onclick="logout()">登出</button>
          </div>

          <ul class="nav nav-pills mb-3" id="pills-tab">
            <li class="nav-item">
              <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-res">預約資料管理</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-user">帳號密碼管理</button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- 預約管理 -->
            <div class="tab-pane fade show active" id="pills-res">
              <button class="btn btn-success mb-3" onclick="openResModal()">+ 新增預約</button>
              <table class="table table-striped table-hover align-middle">
                <thead>
                  <tr><th>日期</th><th>時段</th><th>場地</th><th>申請人</th><th>用途</th><th>操作</th></tr>
                </thead>
                <tbody id="adminResTable"></tbody>
              </table>
            </div>

            <!-- 帳號管理 -->
            <div class="tab-pane fade" id="pills-user">
              <button class="btn btn-success mb-3" onclick="openUserModal()">+ 新增帳號</button>
              <table class="table table-striped table-hover align-middle">
                <thead>
                  <tr><th>帳號</th><th>密碼</th><th>角色</th><th>操作</th></tr>
                </thead>
                <tbody id="adminUserTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 詳細資料 Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="detailVenue">場地預約詳細內容</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>預約日期：</strong> <span id="detailDate"></span></p>
          <p><strong>預約時段：</strong> <span id="detailSlot"></span></p>
          <p><strong>申請單位/人：</strong> <span id="detailUser"></span></p>
          <p><strong>聯絡電話：</strong> <span id="detailPhone"></span></p>
          <p><strong>使用用途：</strong> <span id="detailPurpose"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 預約編輯 Modal -->
  <div class="modal fade" id="resEditModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="resModalTitle">編輯預約</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="resForm">
            <input type="hidden" id="resId">
            <div class="mb-2">
              <label>申請人/帳號</label>
              <input type="text" id="resUsername" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>場地</label>
              <select id="resVenue" class="form-select" required>
                <option value="智慧中心會議室（20）">智慧中心會議室（20）</option>
                <option value="準備教室B（40）">準備教室B（40）</option>
                <option value="電腦教室（25）">電腦教室（25）</option>
                <option value="視聽教室（90）">視聽教室（90）</option>
                <option value="廚房多功教室（40）">廚房多功教室（40）</option>
                <option value="前庭停車場（30）">前庭停車場（30）</option>
              </select>
            </div>
            <div class="mb-2">
              <label>日期</label>
              <input type="date" id="resDate" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>時段</label>
              <select id="resSlot" class="form-select" required>
                <option value="全天">全天</option>
                <option value="上午">上午</option>
                <option value="下午">下午</option>
              </select>
            </div>
            <div class="mb-2">
              <label>聯絡電話</label>
              <input type="text" id="resPhone" class="form-control">
            </div>
            <div class="mb-2">
              <label>用途說明</label>
              <textarea id="resPurpose" class="form-control" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="saveReservation()">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 帳號編輯 Modal -->
  <div class="modal fade" id="userEditModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalTitle">編輯帳號</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="userForm">
            <div class="mb-2">
              <label>帳號</label>
              <input type="text" id="accUsername" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>密碼</label>
              <input type="text" id="accPassword" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>角色權限</label>
              <select id="accRole" class="form-select">
                <option value="admin">管理者 (admin)</option>
                <option value="user">一般使用者 (user)</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="saveUser()">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ⚠️ 請修改為您的 GAS 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxHgPRz7vJkF-IVhJosVkhyzNW3ZzufFkvI0aCewLWJpgqxgDlCv51ytREH2KBCYM90/exec";
    
    let currentDate = new Date();
    let reservationsData = [];
    let isEditingUser = false;

    window.onload = function() {
      loadReservations();
    };

    // 1. 載入並渲染月曆預約資料
    function loadReservations() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(res => {
          if(res.status === 'success') {
            reservationsData = res.data;
            renderCalendar();
            if(!document.getElementById('adminPanel').classList.contains('d-none')) {
              renderAdminResTable();
            }
          }
        });
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('currentMonthStr').innerText = `${year} 年 ${month + 1} 月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const tbody = document.getElementById('calendarBody');
      tbody.innerHTML = '';

      let dateCounter = 1;
      for (let i = 0; i < 6; i++) {
        let row = document.createElement('tr');
        let hasDate = false;

        for (let j = 0; j < 7; j++) {
          let cell = document.createElement('td');
          if ((i === 0 && j < firstDay) || dateCounter > daysInMonth) {
            cell.classList.add('other-month');
          } else {
            hasDate = true;
            let dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateCounter).padStart(2, '0')}`;
            cell.innerHTML = `<div class="day-number">${dateCounter}</div>`;

            // 抓取當天預約
            let dayEvents = reservationsData.filter(r => r.date === dateStr);
            dayEvents.forEach(e => {
              let badge = document.createElement('a');
              let badgeClass = e.slot === '全天' ? 'badge-full' : (e.slot === '上午' ? 'badge-morning' : 'badge-afternoon');
              badge.className = `event-badge ${badgeClass}`;
              badge.innerText = `[${e.slot}] ${e.venue}`;
              badge.onclick = function() { showDetail(e); };
              cell.appendChild(badge);
            });

            dateCounter++;
          }
          row.appendChild(cell);
        }
        if (hasDate) tbody.appendChild(row);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    // 2. 顯示預約詳細內容 Modal
    function showDetail(item) {
      document.getElementById('detailVenue').innerText = item.venue;
      document.getElementById('detailDate').innerText = item.date;
      document.getElementById('detailSlot').innerText = item.slot;
      document.getElementById('detailUser').innerText = item.username;
      document.getElementById('detailPhone').innerText = item.phone || '無';
      document.getElementById('detailPurpose').innerText = item.purpose || '無';
      new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    // 3. 管理者登入與帳號管理
    function login() {
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPwd').value;
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', username: u, password: p })
      }).then(r => r.json()).then(res => {
        if(res.data && res.data.success) {
          document.getElementById('adminLoginForm').classList.add('d-none');
          document.getElementById('adminPanel').classList.remove('d-none');
          renderAdminResTable();
          loadUsers();
        } else {
          alert('登入失敗，請確認帳號密碼');
        }
      });
    }

    function logout() {
      document.getElementById('adminLoginForm').classList.remove('d-none');
      document.getElementById('adminPanel').classList.add('d-none');
    }

    // 管理者 - 預約管理 (新增/修改/刪除)
    function renderAdminResTable() {
      const tbody = document.getElementById('adminResTable');
      tbody.innerHTML = '';
      reservationsData.forEach(r => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.date}</td>
          <td><span class="badge bg-secondary">${r.slot}</span></td>
          <td>${r.venue}</td>
          <td>${r.username}</td>
          <td>${r.purpose}</td>
          <td>
            <button class="btn btn-sm btn-warning" onclick='editRes(${JSON.stringify(r)})'>修改</button>
            <button class="btn btn-sm btn-danger" onclick='deleteRes("${r.id}")'>刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openResModal() {
      document.getElementById('resForm').reset();
      document.getElementById('resId').value = '';
      document.getElementById('resModalTitle').innerText = "新增預約";
      new bootstrap.Modal(document.getElementById('resEditModal')).show();
    }

    function editRes(r) {
      document.getElementById('resId').value = r.id;
      document.getElementById('resUsername').value = r.username;
      document.getElementById('resVenue').value = r.venue;
      document.getElementById('resDate').value = r.date;
      document.getElementById('resSlot').value = r.slot;
      document.getElementById('resPhone').value = r.phone;
      document.getElementById('resPurpose').value = r.purpose;
      document.getElementById('resModalTitle').innerText = "修改預約";
      new bootstrap.Modal(document.getElementById('resEditModal')).show();
    }

    function saveReservation() {
      const data = {
        id: document.getElementById('resId').value,
        username: document.getElementById('resUsername').value,
        venue: document.getElementById('resVenue').value,
        date: document.getElementById('resDate').value,
        slot: document.getElementById('resSlot').value,
        phone: document.getElementById('resPhone').value,
        purpose: document.getElementById('resPurpose').value
      };
      const act = data.id ? 'updateReservation' : 'addReservation';

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: act, data: data })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        bootstrap.Modal.getInstance(document.getElementById('resEditModal')).hide();
        loadReservations();
      });
    }

    function deleteRes(id) {
      if(!confirm("確定要刪除這筆預約嗎？")) return;
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteReservation', id: id })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        loadReservations();
      });
    }

    // 管理者 - 帳號管理 (新增/修改/刪除)
    function loadUsers() {
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getUsers' })
      }).then(r => r.json()).then(res => {
        if(res.status === 'success') {
          const tbody = document.getElementById('adminUserTable');
          tbody.innerHTML = '';
          res.data.forEach(u => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${u.username}</td>
              <td>${u.password}</td>
              <td><span class="badge bg-info">${u.role}</span></td>
              <td>
                <button class="btn btn-sm btn-warning" onclick='editUser(${JSON.stringify(u)})'>修改</button>
                <button class="btn btn-sm btn-danger" onclick='deleteUser("${u.username}")'>刪除</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      });
    }

    function openUserModal() {
      isEditingUser = false;
      document.getElementById('userForm').reset();
      document.getElementById('accUsername').readOnly = false;
      document.getElementById('userModalTitle').innerText = "新增帳號";
      new bootstrap.Modal(document.getElementById('userEditModal')).show();
    }

    function editUser(u) {
      isEditingUser = true;
      document.getElementById('accUsername').value = u.username;
      document.getElementById('accUsername').readOnly = true;
      document.getElementById('accPassword').value = u.password;
      document.getElementById('accRole').value = u.role;
      document.getElementById('userModalTitle').innerText = "修改帳號密碼";
      new bootstrap.Modal(document.getElementById('userEditModal')).show();
    }

    function saveUser() {
      const data = {
        username: document.getElementById('accUsername').value,
        password: document.getElementById('accPassword').value,
        role: document.getElementById('accRole').value
      };
      const act = isEditingUser ? 'updateUser' : 'addUser';

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: act, data: data })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        bootstrap.Modal.getInstance(document.getElementById('userEditModal')).hide();
        loadUsers();
      });
    }

    function deleteUser(username) {
      if(!confirm(`確定要刪除帳號 ${username} 嗎？`)) return;
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteUser', username: username })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        loadUsers();
      });
    }
  </script>
</body>
</html>
