<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>校園場地預約系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 20px; background-color: #f8f9fa; }
      .container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px;}
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="text-center mb-4">校園場地預約系統</h2>
      
      <div id="loginSection" class="text-center">
        <p>請選擇您的身分：</p>
        <button class="btn btn-primary m-2" onclick="login('user')">一般使用者登入</button>
        <button class="btn btn-danger m-2" onclick="login('admin')">管理者登入</button>
      </div>

      <div id="appSection" class="hidden">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 id="roleTitle"></h4>
          <button class="btn btn-sm btn-secondary" onclick="logout()">登出</button>
        </div>
        
        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title" id="formTitle">新增預約</h5>
            <form id="reservationForm">
              <input type="hidden" id="recordId">
              <div class="row mb-2">
                <div class="col"><input type="text" id="username" class="form-control" placeholder="申請人/帳號" required></div>
                <div class="col">
                  <select id="venue" class="form-control" required>
                    <option value="">選擇場地...</option>
                    <option value="活動中心">活動中心</option>
                    <option value="視聽教室">視聽教室</option>
                    <option value="戶外操場">戶外操場</option>
                  </select>
                </div>
              </div>
              <div class="row mb-2">
                <div class="col"><input type="date" id="date" class="form-control" required></div>
                <div class="col"><input type="time" id="startTime" class="form-control" required></div>
                <div class="col"><input type="time" id="endTime" class="form-control" required></div>
              </div>
              <div class="mb-3">
                <input type="text" id="purpose" class="form-control" placeholder="使用用途說明" required>
              </div>
              <button type="button" id="submitBtn" class="btn btn-success w-100" onclick="submitForm()">送出預約</button>
            </form>
          </div>
        </div>

        <h5>目前預約狀況</h5>
        <div class="table-responsive">
          <table class="table table-striped table-bordered">
            <thead class="table-light">
              <tr>
                <th>日期</th>
                <th>時間</th>
                <th>場地</th>
                <th>申請人</th>
                <th>用途</th>
                <th id="adminActionHeader" class="hidden">操作</th>
              </tr>
            </thead>
            <tbody id="dataTable">
              <tr><td colspan="6" class="text-center">資料載入中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      // ⚠️ 請替換為您的 GAS 部署網址
      const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHgPRz7vJkF-IVhJosVkhyzNW3ZzufFkvI0aCewLWJpgqxgDlCv51ytREH2KBCYM90/exec";
      let currentRole = '';

      function login(role) {
        if(role === 'admin') {
          let pwd = prompt("請輸入管理者密碼 (預設: 1234):");
          if(pwd !== '1234') { alert("密碼錯誤！"); return; }
        }
        
        currentRole = role;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('roleTitle').innerText = role === 'admin' ? "管理者介面" : "使用者介面";
        
        if(role === 'admin') {
          document.getElementById('adminActionHeader').classList.remove('hidden');
        }
        loadData();
      }

      function logout() {
        currentRole = '';
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('reservationForm').reset();
        document.getElementById('adminActionHeader').classList.add('hidden');
      }

      function submitForm() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "處理中...";

        const record = {
          id: document.getElementById('recordId').value,
          username: document.getElementById('username').value,
          venue: document.getElementById('venue').value,
          date: document.getElementById('date').value,
          startTime: document.getElementById('startTime').value,
          endTime: document.getElementById('endTime').value,
          purpose: document.getElementById('purpose').value
        };

        const actionType = record.id ? 'update' : 'add';

        fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: actionType, record: record })
        })
        .then(res => res.json())
        .then(res => {
          alert(res.message);
          document.getElementById('reservationForm').reset();
          document.getElementById('recordId').value = '';
          document.getElementById('submitBtn').innerText = "送出預約";
          document.getElementById('submitBtn').disabled = false;
          document.getElementById('formTitle').innerText = "新增預約";
          loadData();
        })
        .catch(err => {
          alert("發生錯誤：" + err);
          btn.disabled = false;
          btn.innerText = "送出預約";
        });
      }

      function loadData() {
        fetch(GAS_WEB_APP_URL)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            renderTable(res.data);
          }
        });
      }

      function renderTable(data) {
        const tbody = document.getElementById('dataTable');
        tbody.innerHTML = '';
        if(!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center">尚無預約資料</td></tr>';
          return;
        }

        data.forEach(row => {
          let tr = document.createElement('tr');
          let html = `
            <td>${row.date}</td>
            <td>${row.startTime} - ${row.endTime}</td>
            <td>${row.venue}</td>
            <td>${row.username}</td>
            <td>${row.purpose}</td>
          `;
          
          if(currentRole === 'admin') {
            html += `<td><button class="btn btn-sm btn-warning" onclick='editRow(${JSON.stringify(row)})'>修改</button></td>`;
          }
          
          tr.innerHTML = html;
          tbody.appendChild(tr);
        });
      }

      function editRow(row) {
        document.getElementById('recordId').value = row.id;
        document.getElementById('username').value = row.username;
        document.getElementById('venue').value = row.venue;
        document.getElementById('date').value = row.date;
        document.getElementById('startTime').value = row.startTime;
        document.getElementById('endTime').value = row.endTime;
        document.getElementById('purpose').value = row.purpose;
        
        document.getElementById('formTitle').innerText = "修改預約資料 (管理者模式)";
        document.getElementById('submitBtn').innerText = "儲存修改";
        window.scrollTo(0, 0);
      }
    </script>
  </body>
</html>
